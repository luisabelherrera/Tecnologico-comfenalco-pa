<div class="ai-interface" [class.expanded]="isExpanded">
  <!-- Botón para alternar el tamaño con ícono -->
  <button class="toggle-size-button" (click)="toggleChatSize()">
    <span [class.expand-icon]="!isExpanded" [class.collapse-icon]="isExpanded"></span>
  </button>

  <div class="ai-core">
    <div class="ai-ring"></div>
    <div class="ai-face">
      <div class="voice-indicator" [class.active]="isRecording"></div>
      <div class="ai-display" (click)="startVoiceRecognition()">
        <span class="pulse"></span>
        <span class="pulse delay"></span>
      </div>
    </div>
  </div>

  <div class="response-output">
    <p class="ai-text">{{ responseText }}</p>
  </div>

  <div class="chat-history">
    <div class="chat-container">
      <div *ngFor="let message of chatHistory" class="chat-message" [class.user]="message.sender === 'user'" [class.ai]="message.sender === 'ai'">
        <span class="sender">{{ message.sender === 'user' ? 'Tú' : 'IA' }}</span>
        <p>{{ message.message }}</p>
        <span class="timestamp">{{ message.timestamp | date:'HH:mm:ss' }}</span>
      </div>
    </div>
  </div>

  <div class="text-input-container">
    <input 
      type="text" 
      [(ngModel)]="userInput" 
      (keyup.enter)="submitTextInput()" 
      placeholder="Escribe tu comando..." 
      class="text-input"
    >
    <!-- Nuevo contenedor para los botones -->
    <div class="button-container">
      <button (click)="submitTextInput()" class="submit-button">Enviar</button>
      <button (click)="stopAI()" *ngIf="isRecording" class="stop-button">Detener IA</button>
    </div>
  </div>
</div>
