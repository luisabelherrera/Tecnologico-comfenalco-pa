server:
  max-http-request-header-size: 16384  # Reemplazado para evitar deprecación
  port: 9098

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/proyectodeaula?useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect
          format_sql: true

  data:
    redis:
      host: localhost  # Corregido para Redis
      port: 6379
    mongodb:
      host: localhost
      port: 27017
      database: proyectodeaula

  cache:
    type: redis

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

security:
  jwt:
    secret-key: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b

logging:
  level:
    org.springframework.cache: DEBUG
    org.springframework.data.redis.cache: DEBUG
