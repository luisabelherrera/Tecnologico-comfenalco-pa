spring.application.name=demo
server.port=9098
server.address=0.0.0.0

# MySQL CONNECTION
spring.datasource.url=jdbc:mysql://localhost:3306/proyectodeaula?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

server.max-http-header-size=16384

# REDIS CONNECTION (unchanged)
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis

logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis.cache=DEBUG

# MongoDB CONNECTION (unchanged)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=proyectodeaula

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

