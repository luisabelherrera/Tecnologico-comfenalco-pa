<div class="container">
  <h1 class="title">Lista de Acudientes</h1>

  <div class="actions-container">
    <a [routerLink]="['/acudientes/create']" mat-raised-button color="primary" class="btn-create">
      Crear Nuevo Acudiente
    </a>
    <p>
      
    </p>
    <div class="filter-container">
      <mat-form-field appearance="outline" class="filter-select">
        <mat-label>Filtrar por</mat-label>
        <mat-select [(value)]="filterType">
          <mat-option value="nombre">Nombre</mat-option>
          <mat-option value="documento">Documento de Identidad</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="search-box">
        <mat-form-field appearance="outline" class="input-search">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Buscar...">
        </mat-form-field>
      </div>
    </div>
  </div>

  <div class="table-container">
    <!-- Tabla con ordenamiento -->
    <table mat-table [dataSource]="dataSource" matSort class="custom-table">
      
      <!-- Columna de Nombres -->
      <ng-container matColumnDef="nombres">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombres </th>
        <td mat-cell *matCellDef="let acudiente">{{ acudiente.nombres }}</td>
      </ng-container>
  
      <!-- Columna de Apellidos -->
      <ng-container matColumnDef="apellidos">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Apellidos </th>
        <td mat-cell *matCellDef="let acudiente">{{ acudiente.apellidos }}</td>
      </ng-container>
  
      <!-- Columna de Documento de Identidad -->
      <ng-container matColumnDef="documentoIdentidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Documento de Identidad </th>
        <td mat-cell *matCellDef="let acudiente">{{ acudiente.documentoIdentidad }}</td>
      </ng-container>
  
      <!-- Columna de Ciudad -->
      <ng-container matColumnDef="ciudad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ciudad </th>
        <td mat-cell *matCellDef="let acudiente">{{ acudiente.ciudad }}</td>
      </ng-container>
  
      <!-- Columna de Activo -->
      <ng-container matColumnDef="activo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Activo </th>
        <td mat-cell *matCellDef="let acudiente">
          <div class="estado-indicador" [ngClass]="acudiente.activo ? 'activo' : 'inactivo'"></div>
        </td>
      </ng-container>
  
      <!-- Columna de Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let acudiente">
          <a [routerLink]="['/acudientes/details', acudiente.idAcudiente]" mat-button color="accent">Ver Detalles</a>
          <a [routerLink]="['/acudientes/edit', acudiente.idAcudiente]" mat-button color="warn">Editar</a>
          <button mat-button (click)="deleteAcudiente(acudiente.idAcudiente)" color="warn">Eliminar</button>
        </td>
      </ng-container>
  
      <!-- Fila de encabezados y datos -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  

  <div class="paginator">
    <mat-paginator 
    [length]="totalElements"  
    [pageSize]="pageSize"     
    [pageSizeOptions]="[5, 10, 25, 50, 100, 1000]" 
    [pageIndex]="pageIndex"   
    (page)="metodoabsorver($event)">
  </mat-paginator>


  </div>
</div>
