<h2 mat-dialog-title>{{ data.titulo }}</h2>
<div mat-dialog-content>
  <p><strong>Fecha de Creación:</strong> {{ data.fechaCreacion | date: 'longDate' }}</p>
  <p>{{ data.contenido }}</p>
  <img *ngIf="data.imagen" [src]="data.imagen" alt="Imagen de Noticia" class="imagen-dialog" />
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cerrar</button>
</div>
