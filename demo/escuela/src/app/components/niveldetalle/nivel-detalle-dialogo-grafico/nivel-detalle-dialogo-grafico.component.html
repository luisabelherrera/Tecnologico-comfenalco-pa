<div class="dialog-container animate__animated animate__fadeIn">
  <div class="dialog-header">
    <h2 class="dialog-title">Análisis de Vacantes por Nivel</h2>
    <button class="close-icon" mat-icon-button (click)="close()" matTooltip="Cerrar">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="dialog-toolbar">
    <mat-form-field appearance="outline" class="filter-select">
      <mat-label>Filtrar por Nivel</mat-label>
      <mat-select [(value)]="selectedNivel" (selectionChange)="applyNivelFilter()">
        <mat-option value="">Todos los Niveles</mat-option>
        <mat-option *ngFor="let nivel of uniqueNiveles" [value]="nivel">{{ nivel }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="dialog-content">
    <div class="charts-container">
      <div class="chart-card animate__animated animate__fadeInUp">
        <h3 class="chart-title">Comparación</h3>
        <div class="chart-wrapper">
          <canvas id="barChart"></canvas>
        </div>
      </div>
      <div class="chart-card animate__animated animate__fadeInUp" [style.animation-delay]="'0.1s'">
        <h3 class="chart-title">Distribución</h3>
        <div class="chart-wrapper">
          <canvas id="doughnutChart"></canvas>
        </div>
      </div>
      <div class="chart-card animate__animated animate__fadeInUp" [style.animation-delay]="'0.2s'">
        <h3 class="chart-title">Totales</h3>
        <div class="chart-wrapper">
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>

    <div class="summary-card animate__animated animate__fadeInUp" [style.animation-delay]="'0.3s'">
      <h3 class="summary-title">Resumen</h3>
      <div class="summary-list">
        <div class="summary-item" *ngFor="let nd of filteredNivelDetalles">
          <div class="summary-label">
            <i class="fas fa-school"></i>
            {{ nd.gradoSeccion.descripcionGrado }} - {{ nd.gradoSeccion.descripcionSeccion }}
          </div>
          <div class="summary-values">
            <span class="value disponible" matTooltip="Disponibles">{{ nd.vacantesDisponibles }}</span>
            <span class="value ocupada" matTooltip="Ocupadas">{{ nd.vacantesOcupadas }}</span>
            <span class="value total" matTooltip="Total">{{ nd.totalVacantes }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <button class="close-button" mat-raised-button color="primary" (click)="close()">Cerrar</button>
  </div>
</div>
