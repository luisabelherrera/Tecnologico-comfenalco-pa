<div class="theme-customizer">
  <section class="theme-creator">
    <h3>Personalizar Tema</h3>
    <div class="form-group">
      <label for="theme-name">Nombre del Tema:</label>
      <input
        id="theme-name"
        [(ngModel)]="selectedTheme.name"
        placeholder="Ej: Navidad"
        class="form-control"
      />
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" [(ngModel)]="useSplitColors" (change)="toggleSplitColors()" />
        Usar colores divididos
      </label>
    </div>

    <div class="form-group" *ngIf="!useSplitColors">
      <label for="background-color">Color de Fondo:</label>
      <input
        id="background-color"
        type="color"
        [(ngModel)]="selectedTheme.backgroundColor"
        class="color-picker"
      />
    </div>

    <div class="form-group" *ngIf="useSplitColors">
      <label for="background-color-left">Color de Fondo Izquierdo:</label>
      <input
        id="background-color-left"
        type="color"
        [(ngModel)]="selectedTheme.backgroundColorLeft"
        class="color-picker"
      />
    </div>

    <div class="form-group" *ngIf="useSplitColors">
      <label for="background-color-right">Color de Fondo Derecho:</label>
      <input
        id="background-color-right"
        type="color"
        [(ngModel)]="selectedTheme.backgroundColorRight"
        class="color-picker"
      />
    </div>

    <div class="form-group">
      <label for="text-color">Color de Texto:</label>
      <input
        id="text-color"
        type="color"
        [(ngModel)]="selectedTheme.textColor"
        class="color-picker"
      />
    </div>

    <!-- Theme Preview -->
    <div class="theme-preview">
      <h4>Vista Previa</h4>
      <div 
        class="preview-container" 
        [ngClass]="{'split': useSplitColors, 'solid': !useSplitColors}"
        [style.--left-color]="selectedTheme.backgroundColorLeft"
        [style.--right-color]="selectedTheme.backgroundColorRight"
        [style.--bg-color]="selectedTheme.backgroundColor"
        [style.--text-color]="selectedTheme.textColor">
        <div class="preview-text">
          {{ selectedTheme.name || 'Vista Previa del Tema' }}
        </div>
      </div>
      <p class="preview-info">Esta es una vista previa de cómo se verá tu tema</p>
    </div>

    <button class="btn btn-save" (click)="saveTheme()">Guardar Tema</button>
  </section>

  <section class="predefined-themes">
    <h4>Temas Predefinidos</h4>
    <div class="theme-list">
      <button
        *ngFor="let theme of predefinedThemes"
        (click)="selectPredefinedTheme(theme)"
        [disabled]="theme.isActive"
        class="btn btn-theme"
        [ngClass]="{'active': theme.isActive}"
      >
        {{ theme.name }} <span *ngIf="theme.isActive">(Activo)</span>
      </button>
    </div>
  </section>

  <section class="saved-themes">
    <h4>Temas Guardados</h4>
    <div class="theme-list" *ngIf="themes.length > 0; else noThemes">
      <div *ngFor="let theme of themes" class="theme-item">
        <button
          (click)="applyTheme(theme)"
          [disabled]="theme.isActive"
          class="btn btn-theme"
          [ngClass]="{'active': theme.isActive}"
        >
          {{ theme.name }} <span *ngIf="theme.isActive">(Activo)</span>
        </button>
        <button
          (click)="deleteTheme(theme.id!)"
          class="btn btn-delete"
          *ngIf="theme.id"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>
    <ng-template #noThemes>
      <div class="empty-state">
        No hay temas guardados. Crea un tema personalizado o selecciona uno predefinido.
      </div>
    </ng-template>
  </section>
</div>
