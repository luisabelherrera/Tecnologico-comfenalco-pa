<h2 mat-dialog-title>Seleccionar Estudiante</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Buscar Estudiante</mat-label>
    <input matInput [(ngModel)]="searchTerm" (input)="filterEstudiantes()" placeholder="Ej: 123456 o Nombre">
  </mat-form-field>

  <table mat-table [dataSource]="filteredEstudiantes" class="mat-elevation-z8">
    <ng-container matColumnDef="documento">
      <th mat-header-cell *matHeaderCellDef>Documento</th>
      <td mat-cell *matCellDef="let estudiante">{{ estudiante.documentoIdentidad }}</td>
    </ng-container>
    <ng-container matColumnDef="nombres">
      <th mat-header-cell *matHeaderCellDef>Nombres</th>
      <td mat-cell *matCellDef="let estudiante">{{ estudiante.nombres }} {{ estudiante.apellidos }}</td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let estudiante">
        <button mat-button color="primary" (click)="selectEstudiante(estudiante)">Seleccionar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['documento', 'nombres', 'acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['documento', 'nombres', 'acciones']"></tr>
  </table>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="onNoClick()">Cancelar</button>
</mat-dialog-actions>
