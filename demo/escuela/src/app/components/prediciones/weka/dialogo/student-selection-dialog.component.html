<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-title">Seleccionar Estudiante</h2>
  <mat-dialog-content class="dialog-content">
    <div class="search-container">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar Estudiante</mat-label>
        <input matInput [(ngModel)]="searchTerm" (input)="filterEstudiantes()" placeholder="Ej: 123456 o Nombre">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="paginatedEstudiantes" class="student-table">
        <ng-container matColumnDef="documento">
          <th mat-header-cell *matHeaderCellDef>Documento</th>
          <td mat-cell *matCellDef="let estudiante">{{ estudiante.documentoIdentidad }}</td>
        </ng-container>
        <ng-container matColumnDef="nombres">
          <th mat-header-cell *matHeaderCellDef>Nombres</th>
          <td mat-cell *matCellDef="let estudiante">{{ estudiante.nombres }} {{ estudiante.apellidos }}</td>
        </ng-container>
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let estudiante">
            <button mat-raised-button color="primary" class="select-btn" (click)="selectEstudiante(estudiante)">
              <mat-icon>check</mat-icon> Seleccionar
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="['documento', 'nombres', 'acciones']" class="header-row"></tr>
        <tr mat-row *matRowDef="let row; columns: ['documento', 'nombres', 'acciones']" class="data-row"></tr>

        <tr class="mat-row no-data-row" *matNoDataRow>
          <td colspan="3" class="no-data">No se encontraron estudiantes</td>
        </tr>
      </table>

      <div class="pagination" *ngIf="filteredEstudiantes.length > itemsPerPage">
        <button mat-icon-button (click)="previousPage()" [disabled]="currentPage === 1">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <span>{{ currentPage }} / {{ totalPages }}</span>
        <button mat-icon-button (click)="nextPage()" [disabled]="currentPage === totalPages">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="dialog-actions">
    <button mat-flat-button color="warn" class="cancel-btn" (click)="onNoClick()">Cancelar</button>
  </mat-dialog-actions>
</div>
