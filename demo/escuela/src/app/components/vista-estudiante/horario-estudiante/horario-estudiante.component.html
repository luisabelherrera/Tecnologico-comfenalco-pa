<div class="container">
  <div class="header">
    <h2>Mi Horario de Clases</h2>
  </div>

  <div class="schedule-container" *ngIf="timeSlots.length > 0; else noSchedule">
    <table class="schedule-table">
      <thead>
        <tr>
          <th *ngFor="let day of daysOfWeek">{{ day }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let slot of timeSlots">
          <td *ngFor="let day of daysOfWeek">
            <div class="schedule-cell" *ngIf="schedule[day][slot.inicio + '-' + slot.fin]" [ngClass]="{
              'conflict': schedule[day][slot.inicio + '-' + slot.fin].hasConflict,
              'no-conflict': !schedule[day][slot.inicio + '-' + slot.fin].hasConflict
            }">
              <p class="course">{{ schedule[day][slot.inicio + '-' + slot.fin].curso }}</p>
              <p class="professor">{{ schedule[day][slot.inicio + '-' + slot.fin].profesor }}</p>
              <p class="time">{{ slot.inicio }} - {{ slot.fin }}</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noSchedule>
    <div class="no-data">
      <p>No tienes horarios registrados.</p>
    </div>
  </ng-template>
</div>
