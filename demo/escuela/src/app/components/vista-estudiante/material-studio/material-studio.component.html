<div class="container mx-auto p-4">
  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="flex justify-center items-center h-64">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoading" class="space-y-6">
    <!-- Curricular Selection -->
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Seleccionar Curricular</mat-label>
      <mat-select [(ngModel)]="selectedCurricular" (selectionChange)="onCurricularChange($event.value)">
        <mat-option *ngFor="let curricular of curriculares" [value]="curricular">
          {{ curricular.descripcion }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Questions Section -->
    <div *ngIf="selectedQuestion" class="bg-white shadow-md rounded-lg p-6">
      <h2 class="text-2xl font-bold mb-4">Pregunta</h2>
      <p class="text-lg mb-4">{{ selectedQuestion.text }}</p>
      <mat-radio-group [(ngModel)]="userAnswer" class="flex flex-col space-y-2">
        <mat-radio-button *ngFor="let option of selectedQuestion.options" [value]="option">
          {{ option }}
        </mat-radio-button>
      </mat-radio-group>
      <button mat-raised-button color="primary" class="mt-4" (click)="checkAnswer()" [disabled]="!userAnswer">
        Verificar Respuesta
      </button>
    </div>

    <!-- Study Materials Section -->
    <div *ngIf="studyMaterials.length > 0" class="space-y-4">
      <h2 class="text-2xl font-bold">Materiales de Estudio</h2>
      <mat-accordion>
        <mat-expansion-panel *ngFor="let material of studyMaterials">
          <mat-expansion-panel-header>
            <mat-panel-title>{{ material.title }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p>{{ material.content }}</p>
          <h4 class="font-semibold mt-4">Actividades:</h4>
          <ul class="list-disc pl-5">
            <li *ngFor="let activity of material.activities">{{ activity }}</li>
          </ul>
        </mat-expansion-panel>
      </mat-accordion>
    </div>

    <!-- YouTube Videos Section -->
    <div *ngIf="youtubeVideos.length > 0" class="space-y-4">
      <h2 class="text-2xl font-bold">Videos Educativos</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let video of youtubeVideos" class="bg-white shadow-md rounded-lg overflow-hidden">
          <iframe
            [src]="getSafeVideoUrl(video.videoId)"
            class="w-full h-48"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
          <div class="p-4">
            <h3 class="text-lg font-semibold">{{ video.title }}</h3>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
