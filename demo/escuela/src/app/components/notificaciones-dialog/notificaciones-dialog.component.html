<h2 mat-dialog-title>📋 Notificaciones ({{ unreadCount }} sin leer)</h2>

<mat-dialog-content class="dialog-content">
  <mat-list>
    <mat-list-item
      *ngFor="let notification of notifications"
      class="notification-item"
      [ngClass]="{ 'read': notification.leida }"
      (click)="openFullMessage(notification)"
      role="button"
      tabindex="0"
      (keyup.enter)="openFullMessage(notification)"
    >
      <mat-icon
        mat-list-icon
        [color]="notification.leida ? 'accent' : 'primary'"
      >
        {{ notification.leida ? 'notifications_active' : 'notifications' }}
      </mat-icon>

      <div class="notification-text" matLine>
        <strong>{{ notification.titulo || 'Sin título' }}</strong>:
        {{ notification.mensaje | slice: 0:60 }}{{ notification.mensaje.length > 60 ? '...' : '' }}
      </div>

      <button
        mat-icon-button
        (click)="markAsRead(notification.id); $event.stopPropagation()"
        *ngIf="!notification.leida"
        aria-label="Marcar como leída"
        class="mark-read-btn"
      >
        <mat-icon>done</mat-icon>
      </button>
    </mat-list-item>

    <mat-list-item *ngIf="notifications.length === 0">
      <p mat-line>No hay notificaciones disponibles</p>
    </mat-list-item>
  </mat-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-raised-button
    class="close-button"
    [ngStyle]="{
      'background-color': (currentTheme$ | async)?.backgroundColor
    }"
    (click)="close()"
    aria-label="Cerrar diálogo"
  >
    Cerrar
  </button>
</mat-dialog-actions>
