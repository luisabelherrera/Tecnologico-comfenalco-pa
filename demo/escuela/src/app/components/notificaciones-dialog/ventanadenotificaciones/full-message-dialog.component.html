<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content class="dialog-content">
  <p class="full-message">{{ data.message }}</p>
  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-raised-button color="warn" (click)="deleteNotification()" aria-label="Eliminar notificación">
    Eliminar
  </button>
  <button mat-stroked-button color="primary" (click)="markAsRead()" aria-label="Marcar como leída">
    Marcar como leída
  </button>
  <button mat-raised-button color="accent" (click)="close()" aria-label="Cerrar diálogo">
    Cerrar
  </button>
</mat-dialog-actions>
